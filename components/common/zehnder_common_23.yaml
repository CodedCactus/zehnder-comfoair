# Common base for 2.x.x and 3.x.x firmware versions

text_sensor:
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Serial Number"
    id: comfoair_serial_number
    icon: "mdi:identifier"
    register_type: holding
    disabled_by_default: true
    address: 0x073
    response_size: 32
    raw_encode: ANSI
    lambda: |-
      std::string serial = data;
      serial.erase(serial.find('\0'));
      return serial;

  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Model"
    id: zehnder_model
    icon: mdi:tag-text
    register_type: holding
    entity_category: "diagnostic"
    address: 0x06D
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = modbus::helpers::word_from_hex_str(x, 0);
      switch (value) {
        case 1:  return std::string("Service PCB");
        case 2:  return std::string("CA E 300 R P");
        case 3:  return std::string("CA E 300 L P");
        case 4:  return std::string("CA E 300 R RF");
        case 5:  return std::string("CA E 300 L RF");
        case 6:  return std::string("CA E 400 R P");
        case 7:  return std::string("CA E 400 L P");
        case 8:  return std::string("CA E 400 R RF");
        case 9:  return std::string("CA E 400 L RF");
        case 10: return std::string("CA E 350 R DE");
        case 11: return std::string("CA E 350 L DE");
        case 12: return std::string("CA E 350 V R DE");
        case 13: return std::string("CA E 350 V L DE");
        case 14: return std::string("CA PRO 300 R");
        case 15: return std::string("CA PRO 300 L");
        case 16: return std::string("CA E 300 R 0-10V");
        case 17: return std::string("CA E 300 L 0-10V");
        case 18: return std::string("CA E 400 R 0-10V");
        case 19: return std::string("CA E 400 L 0-10V");
        case 20: return std::string("CA E 350 R SI");

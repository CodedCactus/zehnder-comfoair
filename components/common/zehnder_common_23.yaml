binary_sensor:
  # --- fireplace mode ---
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: Fireplace mode
    icon: mdi:fireplace
    address: 0x151
    register_type: holding
    entity_category: "diagnostic"
    id: zehnder_fireplace_mode

  # --- pre-heater presence ---
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Pre-heater present"
    id: zehnder_pre_heater_present

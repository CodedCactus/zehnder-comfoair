time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - component.update: filter_age_days
        - component.update: filter_replacement_in

globals:
  - id: filter_reset_timestamp
    type: time_t
    restore_value: yes
    initial_value: '0'

  - id: filter_replacement_interval_days
    type: double
    restore_value: yes
    initial_value: '90'

# filter age in days
sensor:
  - platform: template
    name: "Filter age"
    id: filter_age_days
    unit_of_measurement: "d"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 300s

    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid() || id(filter_reset_timestamp) == 0) return NAN;

      time_t diff = now.timestamp - id(filter_reset_timestamp);
      if (diff < 0) diff = 0;

      return (int)(diff / 86400);

  # time remaining until filter replacement is needed
  - platform: template
    name: "Filter replacement in"
    id: filter_replacement_in
    unit_of_measurement: "d"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 300s

    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid() || id(filter_reset_timestamp) == 0) return NAN;

      time_t diff = now.timestamp - id(filter_reset_timestamp);
      if (diff < 0) diff = 0;

      int age_days = diff / 86400;
      int remaining = id(filter_replacement_interval_days) - age_days;

      return remaining > 0 ? remaining : 0;

# replacement status
binary_sensor:
  - platform: template
    name: "Filter status"
    id: filter_status
    device_class: problem
    entity_category: diagnostic

    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid() || id(filter_reset_timestamp) == 0) return false;

      time_t diff = now.timestamp - id(filter_reset_timestamp);
      if (diff < 0) diff = 0;

      int age_days = diff / 86400;

      return age_days >= id(filter_replacement_interval_days);

# reset timer button
button:
  - platform: template
    name: "Reset filter timer"
    id: reset_filter_timer
    entity_category: config

    on_press:
      then:
        - lambda: |-
            auto now = id(ha_time).now();
            if (now.is_valid()) {
              id(filter_reset_timestamp) = now.timestamp;
            }
        - component.update: filter_age_days
        - component.update: filter_replacement_in

# configuration for the filter replacement interval (in days)
number:
  - platform: template
    name: "Filter replacement interval"
    id: filter_replacement_interval
    unit_of_measurement: "days"
    min_value: 30
    max_value: 365
    step: 1
    entity_category: config

    lambda: |-
      return id(filter_replacement_interval_days);

    set_action:
      then:
        - lambda: |-
            id(filter_replacement_interval_days) = x;
        - component.update: filter_replacement_in

switch:
  - platform: template
    name: "Auto detect filter replacement"
    id: auto_reset_on_standby
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

text_sensor:
  - platform: template
    name: "Zehnder Status Monitor"
    id: zehnder_status_monitor
    internal: true
    lambda: return id(zehnder_status).state;

    on_value:
      then:
        - lambda: |-
            if (x == "Standby" && id(auto_reset_on_standby).state) {
              id(reset_filter_timer).press();
            }
time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: filter_reset_timestamp
    type: time_t
    restore_value: yes
    initial_value: '0'

  - id: filter_replacement_interval_days
    type: float
    restore_value: yes
    initial_value: '90'

# filter age in days
sensor:
  - platform: template
    name: "Filter age"
    id: filter_age_days
    unit_of_measurement: "d"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 60s

    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid()) return NAN;
      if (id(filter_reset_timestamp) == 0) return 0.0;

      return (now.timestamp - id(filter_reset_timestamp)) / 86400.0;

# time remaining until filter replacement is needed
  - platform: template
    name: "Filter replacement in"
    id: filter_replacement_in
    unit_of_measurement: "d"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 300s

    lambda: |-
      if (isnan(id(filter_age_days).state)) return NAN;

      float remaining = id(filter_replacement_interval_days) - id(filter_age_days).state;
      return remaining > 0 ? remaining : 0.0;

# replacement needed sensor
binary_sensor:
  - platform: template
    name: "Filter replacement needed"
    id: filter_replacement_needed
    device_class: problem
    entity_category: diagnostic

    lambda: |-
      if (isnan(id(filter_age_days).state)) return false;

      return id(filter_age_days).state >= id(filter_replacement_interval_days);

# reset timer button
button:
  - platform: template
    name: "Reset filter timer"
    id: reset_filter_timer
    entity_category: config

    on_press:
      then:
        - lambda: |-
            auto now = id(ha_time).now();
            if (now.is_valid()) {
              id(filter_reset_timestamp) = now.timestamp;
            }

# configuration for the filter replacement interval (in days)
number:
  - platform: template
    name: "Filter replacement interval"
    id: filter_replacement_interval
    unit_of_measurement: "days"
    min_value: 30
    max_value: 365
    step: 1
    entity_category: config
    lambda: |-
      return id(filter_replacement_interval_days);
    set_action:
      then:
        - lambda: |-
            id(filter_replacement_interval_days) = x;
            id(filter_replacement_in).update();

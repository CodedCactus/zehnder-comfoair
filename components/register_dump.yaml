# Register Dump via Web Server
# Provides a CSV export of all holding registers 0-374

web_server_base:
  id: zehnder_web_server_base

web_server:
  id: zehnder_web_server
  web_server_base_id: zehnder_web_server_base

globals:
  - id: register_dump_result
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: register_dump_batch
    type: int
    restore_value: no
    initial_value: '0'

  - id: register_dump_complete
    type: bool
    restore_value: no
    initial_value: 'false'

text_sensor:
  - platform: template
    name: "Register Dump"
    id: zehnder_register_dump_output
    internal: true
    entity_category: "diagnostic"
    update_interval: never
    icon: mdi:database-export

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          #ifdef USE_ESP32_FRAMEWORK_ESP_IDF

          class DumpHandler : public esphome::web_server_idf::AsyncWebHandler {
           public:
            bool canHandle(esphome::web_server_idf::AsyncWebServerRequest *request) const override {
              std::string url = request->url_to();
              return url == "/registers" ||
                     url == "/registers/start" ||
                     url == "/registers/status" ||
                     url == "/registers/download.csv";
            }

            void handleRequest(esphome::web_server_idf::AsyncWebServerRequest *request) override {
              std::string url = request->url_to();

              if (url == "/registers") {
                std::string html = "<html><head><title>Zehnder Register Dump</title>";
                html += "<style>body{font-family:sans-serif;margin:0;line-height:1.5;background:#f4f7f9;color:#333;}";
                html += "nav{background:#1a1a1a;padding:15px 30px;display:flex;gap:20px;}";
                html += "nav a{color:#aaa;text-decoration:none;} nav a:hover{color:#fff;}";
                html += ".content{max-width:800px;margin:40px auto;padding:40px;background:#fff;}";
                html += ".btn{background:#03a9f4;color:#fff;padding:12px 24px;border:none;border-radius:8px;}";
                html += "</style>";

                html += "<script>function poll(){fetch('/registers/status').then(r=>r.json()).then(d=>{";
                html += "document.getElementById('st').innerText=d.s;";
                html += "if(d.c){document.getElementById('dl').style.display='block';}else{setTimeout(poll,1000);}";
                html += "});}window.onload=poll;</script></head><body>";

                html += "<nav><a href='/registers'>Register Dump</a></nav>";
                html += "<div class='content'><h1>Register Dump</h1>";
                html += "<div>Status: <span id='st'>" + id(zehnder_register_dump_output).state + "</span></div>";

                html += "<form action='/registers/start' method='POST'>";
                html += "<input type='submit' class='btn' value='Start Dump'>";
                html += "</form>";

                html += "<div id='dl' style='display:" +
                        std::string(id(register_dump_complete) ? "block" : "none") +
                        ";margin-top:20px;'>";
                html += "<a href='/registers/download.csv'>Download CSV</a></div>";

                html += "</div></body></html>";

                request->send(200, "text/html", html.c_str());
              }

              else if (url == "/registers/start") {
                id(register_dump_complete) = false;
                id(register_dump_script).execute();
                request->redirect("/registers");
              }

              else if (url == "/registers/status") {
                std::string json = "{\"s\":\"" +
                  id(zehnder_register_dump_output).state +
                  "\",\"c\":" + (id(register_dump_complete) ? "true" : "false") + "}";

                auto *response = request->beginResponse(200, "application/json", json.c_str());
                response->addHeader("Cache-Control", "no-cache");
                request->send(response);
              }

              else if (url == "/registers/download.csv") {
                auto *response = request->beginResponse(
                  200,
                  "text/csv",
                  id(register_dump_result)
                );
                response->addHeader(
                  "Content-Disposition",
                  "attachment; filename=\"registers.csv\""
                );
                request->send(response);
              }
            }
          };

          id(zehnder_web_server_base).get_server()->addHandler(new DumpHandler());

          #else

          class ArduinoDumpHandler : public AsyncWebHandler {
           public:
            bool canHandle(AsyncWebServerRequest *request) const override {
              if (request->method() != HTTP_GET && request->method() != HTTP_POST)
                return false;

              String url = request->url_to();

              return url == "/registers" ||
                     url == "/registers/start" ||
                     url == "/registers/status" ||
                     url == "/registers/download.csv";
            }

            void handleRequest(AsyncWebServerRequest *request) override {
              String url = request->url_to();

              if (url == "/registers") {
                String html = "<html><head><title>Register Dump</title></head><body>";
                html += "<h1>Register Dump</h1>";
                html += "<p>Status: " + String(id(zehnder_register_dump_output).state.c_str()) + "</p>";
                html += "<form action='/registers/start' method='POST'>";
                html += "<button>Start</button></form>";

                html += "<div style='display:" +
                        String(id(register_dump_complete) ? "block" : "none") +
                        "'><a href='/registers/download.csv'>Download</a></div>";

                html += "</body></html>";

                request->send(200, "text/html", html);
              }

              else if (url == "/registers/start" && request->method() == HTTP_POST) {
                id(register_dump_complete) = false;
                id(register_dump_script).execute();
                request->redirect("/registers");
              }

              else if (url == "/registers/status") {
                String json = "{\"s\":\"" +
                  String(id(zehnder_register_dump_output).state.c_str()) +
                  "\",\"c\":" + (id(register_dump_complete) ? "true" : "false") + "}";

                AsyncWebServerResponse *response =
                  request->beginResponse(200, "application/json", json);

                response->addHeader("Cache-Control", "no-cache");
                request->send(response);
              }

              else if (url == "/registers/download.csv") {
                std::string &csv = id(register_dump_result);

                AsyncWebServerResponse *response =
                  request->beginResponse(
                    200,
                    "text/csv",
                    (uint8_t*)csv.data(),
                    csv.size()
                  );

                response->addHeader(
                  "Content-Disposition",
                  "attachment; filename=\"registers.csv\""
                );

                request->send(response);
              }
            }
          };

          id(zehnder_web_server_base).get_server()->addHandler(new ArduinoDumpHandler());

          #endif


script:
  - id: register_dump_script
    mode: single
    then:
      - lambda: |-
          id(register_dump_result) = "Addr (dec),Addr (hex),Value\n";
          id(register_dump_batch) = 0;
          id(register_dump_complete) = false;

          id(zehnder_register_dump_output).publish_state("Reading registers...");

          auto *controller = id(modbus_device);
          const int batch_size = 50;
          const int total_registers = 375;
          const int num_batches = (total_registers + batch_size - 1) / batch_size;

          for (int batch = 0; batch < num_batches; batch++) {
            int start = batch * batch_size;
            int count = std::min(batch_size, total_registers - start);

            auto cmd =
              esphome::modbus_controller::ModbusCommandItem::create_read_command(
                controller,
                esphome::modbus_controller::ModbusRegisterType::HOLDING,
                start,
                count
              );

            cmd.on_data_func = [start, count, num_batches](auto, auto, const std::vector<uint8_t> &data) {

              for (int i = 0; i < count && (i * 2 + 1) < (int)data.size(); i++) {
                uint16_t value = (data[i * 2] << 8) | data[i * 2 + 1];
                int addr = start + i;

                char hex[8];
                snprintf(hex, sizeof(hex), "0x%03X", addr);

                id(register_dump_result) +=
                  std::to_string(addr) + "," +
                  std::string(hex) + "," +
                  std::to_string(value) + "\n";
              }

              id(register_dump_batch)++;

              if (id(register_dump_batch) >= num_batches) {
                id(register_dump_complete) = true;
                id(zehnder_register_dump_output).publish_state("Complete (375 registers)");
              } else {
                id(zehnder_register_dump_output).publish_state(
                  "Reading... (" + std::to_string(id(register_dump_batch)) + "/8)"
                );
              }
            };

            controller->queue_command(cmd);
          }
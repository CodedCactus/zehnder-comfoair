name: ESPHome CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip esphome

      - name: Create dummy secrets
        run: |
          cat > dummy_secrets.yaml <<'EOF'
          wifi_ssid: "ci_ssid"
          wifi_password: "ci_password"
          api_key: "ci_api_key"
          ota_password: "ci_ota_password"
          device_api_key: "ci_device_api_key"
          EOF

      - name: Find ESPHome example configs
        id: find-configs
        run: |
          configs=$(find examples -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
          echo "configs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$configs" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate example configs
        run: |
          while IFS= read -r cfg; do
            echo "Validating $cfg"
            esphome config "$cfg" --secret-file dummy_secrets.yaml
          done <<< "${{ steps.find-configs.outputs.configs }}"

      - name: Compile example configs
        run: |
          while IFS= read -r cfg; do
            echo "Compiling $cfg"
            esphome compile "$cfg" --secret-file dummy_secrets.yaml
          done <<< "${{ steps.find-configs.outputs.configs }}"

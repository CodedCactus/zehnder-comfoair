name: ESPHome CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.find.outputs.configs }}

    steps:
      - uses: actions/checkout@v4

      - id: find
        run: |
          configs=$(find examples -type f \( -name '*.yaml' -o -name '*.yml' \) \
            ! -name 'm5stack.yaml' \
            ! -name 'esp32_external_dac.yaml' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "configs=$configs" >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

- name: Install dependencies
  run: pip install -r requirements.txt
      - name: Install ESPHome
        run: pip install esphome

      - name: Create dummy secrets
        run: |
          mkdir -p examples
          python - <<'PY'
          import base64, os
          def key():
              return base64.b64encode(os.urandom(32)).decode()
          data = {
              'wifi_ssid': 'ci_ssid',
              'wifi_password': 'ci_password',
              'api_key': key(),
              'ota_password': 'ci_ota_password',
              'device_api_key': key(),
          }
          with open('examples/secrets.yaml', 'w') as f:
              for k, v in data.items():
                  f.write(f'{k}: "{v}"\n')
          PY

      - name: Validate config
        run: esphome config "${{ matrix.config }}"

  compile:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.prepare.outputs.configs) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create dummy secrets
        run: |
          mkdir -p examples
          python - <<'PY'
          import base64, os
          def key():
              return base64.b64encode(os.urandom(32)).decode()
          data = {
              'wifi_ssid': 'ci_ssid',
              'wifi_password': 'ci_password',
              'api_key': key(),
              'ota_password': 'ci_ota_password',
              'device_api_key': key(),
          }
          with open('examples/secrets.yaml', 'w') as f:
              for k, v in data.items():
                  f.write(f'{k}: "{v}"\n')
          PY

      - name: Compile config
        run: esphome compile "${{ matrix.config }}"